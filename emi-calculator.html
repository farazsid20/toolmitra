<!DOCTYPE html>
<!-- Developed by Ahmad Faraz Siddiqui -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMI Calculator - ZamToolmitra</title>
  <meta name="description" content="Loan EMI, total interest aur total payment calculate karo with ZamToolmitra EMI Calculator.">
  <meta name="author" content="Ahmad Faraz Siddiqui">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#f7f7ed",
              100: "#ecebd1",
              200: "#d9d69d",
              300: "#c8c168",
              400: "#b4ab3d",
              500: "#998d28",
              600: "#7a6f1f",
              700: "#5d5418",
              800: "#423c11",
              900: "#252108"
            },
            ink: "#172033",
            accent: "#d96c3f"
          },
          boxShadow: {
            soft: "0 18px 45px rgba(23, 32, 51, 0.08)"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="site-body tool-page-bg text-ink">
  <div class="site-layer tool-layout mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <a href="index.html" class="inline-flex items-center text-sm font-semibold text-brand-700">&larr; Home par wapas</a>
      <div class="credit-chip rounded-full px-3 py-2 text-xs font-semibold text-brand-700">By Ahmad Faraz Siddiqui</div>
    </div>
    <div class="mt-6 grid gap-6 lg:grid-cols-[0.95fr_1.05fr]">
      <section class="tool-hero-card rounded-[2rem] p-5 sm:p-7">
        <p class="text-sm font-semibold uppercase tracking-[0.22em] text-accent">EMI Calculator</p>
        <h1 class="mt-2 text-3xl font-black">Loan EMI turant nikalo</h1>
        <form id="emiForm" class="mt-6 space-y-4" novalidate>
          <div>
            <label for="loanAmount" class="mb-2 block text-sm font-semibold">Loan Amount *</label>
            <input id="loanAmount" type="number" min="1" class="input-modern w-full rounded-2xl px-4 py-3 outline-none transition">
          </div>
          <div>
            <label for="interestRate" class="mb-2 block text-sm font-semibold">Interest Rate (% per year) *</label>
            <input id="interestRate" type="number" min="0.01" step="0.01" class="input-modern w-full rounded-2xl px-4 py-3 outline-none transition">
          </div>
          <div>
            <label for="loanTenure" class="mb-2 block text-sm font-semibold">Loan Tenure (months) *</label>
            <input id="loanTenure" type="number" min="1" class="input-modern w-full rounded-2xl px-4 py-3 outline-none transition">
          </div>
          <button type="submit" class="primary-button rounded-2xl px-5 py-3 text-sm font-semibold text-white transition">Calculate karo</button>
          <p id="emiMessage" class="text-sm font-medium"></p>
        </form>
      </section>
      <section class="tool-section-card rounded-[2rem] p-5 sm:p-7">
        <p class="text-sm font-semibold uppercase tracking-[0.22em] text-accent">Result</p>
        <h2 class="mt-2 text-2xl font-black">EMI summary</h2>
        <div class="mt-6 grid gap-4">
          <div class="metric-card rounded-3xl p-5">
            <p class="text-xs uppercase tracking-[0.2em] text-stone-500">Monthly EMI</p>
            <p id="monthlyEmi" class="mt-3 text-3xl font-black">₹0</p>
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <div class="metric-card rounded-3xl p-5">
              <p class="text-xs uppercase tracking-[0.2em] text-stone-500">Total Interest</p>
              <p id="totalInterest" class="mt-3 text-2xl font-black">₹0</p>
            </div>
            <div class="metric-card rounded-3xl p-5">
              <p class="text-xs uppercase tracking-[0.2em] text-stone-500">Total Payment</p>
              <p id="totalPayment" class="mt-3 text-2xl font-black">₹0</p>
            </div>
          </div>
        </div>
      </section>
    </div>
    <footer class="tool-footer mt-8 rounded-[2rem] px-6 py-6 text-sm text-stone-300">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <p>Developed by <span class="font-bold text-brand-300">Ahmad Faraz Siddiqui</span></p>
        <div class="flex gap-3 text-stone-400">
          <a href="#" class="hover:text-white">LinkedIn</a>
          <a href="#" class="hover:text-white">GitHub</a>
        </div>
      </div>
    </footer>
  </div>
  <div class="developer-watermark">Made by Ahmad Faraz Siddiqui</div>
  <script src="js/emi-calculator.js"></script>
</body>
</html>
