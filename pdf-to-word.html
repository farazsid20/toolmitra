<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Word Converter - ToolMitra</title>
  <meta name="description" content="PDF file ko Word format me convert karne ke liye beginner-friendly ToolMitra page.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#f7f7ed",
              100: "#ecebd1",
              200: "#d9d69d",
              300: "#c8c168",
              400: "#b4ab3d",
              500: "#998d28",
              600: "#7a6f1f",
              700: "#5d5418",
              800: "#423c11",
              900: "#252108"
            },
            ink: "#172033",
            accent: "#d96c3f"
          },
          boxShadow: {
            soft: "0 18px 45px rgba(23, 32, 51, 0.08)"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="tool-page-bg text-ink">
  <div class="mx-auto max-w-4xl px-4 py-6 sm:px-6 lg:px-8">
    <a href="index.html" class="inline-flex items-center text-sm font-semibold text-brand-700">← Home par wapas</a>
    <section class="mt-6 rounded-3xl bg-white p-5 shadow-soft sm:p-7">
      <p class="text-sm font-semibold uppercase tracking-[0.22em] text-accent">PDF to Word</p>
      <h1 class="mt-2 text-3xl font-black">PDF ko Word me convert karo</h1>
      <p class="mt-3 text-sm leading-6 text-stone-600">Maximum PDF size 10MB. Conversion demo currently simulated hai.</p>
      <p class="mt-3 rounded-2xl bg-brand-50 px-4 py-3 text-sm text-brand-800">Files are not stored for privacy. Aapki files server par store nahi hoti.</p>

      <div class="mt-6 rounded-3xl border border-stone-200 bg-stone-50 p-5">
        <label for="pdfInput" class="mb-2 block text-sm font-semibold">PDF select karo</label>
        <input id="pdfInput" type="file" accept="application/pdf" class="block w-full rounded-2xl border border-stone-200 bg-white px-4 py-3 text-sm">
        <p id="pdfFileName" class="mt-3 text-sm text-stone-600">Abhi koi file select nahi hai.</p>
        <button id="convertPdfBtn" type="button" class="mt-5 rounded-2xl bg-brand-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-brand-700">Convert karo</button>
        <div id="pdfLoader" class="mt-5 hidden items-center gap-3 text-sm font-medium text-brand-700">
          <span class="inline-flex h-4 w-4 animate-spin rounded-full border-2 border-brand-300 border-t-brand-700"></span>
          Conversion chal raha hai...
        </div>
        <p id="pdfMessage" class="mt-4 text-sm font-medium"></p>
        <a id="pdfDownloadLink" href="#" download="converted.docx" class="mt-5 hidden rounded-2xl bg-ink px-5 py-3 text-sm font-semibold text-white">Download karo</a>
      </div>
    </section>
  </div>
  <script src="js/pdf-to-word.js"></script>
</body>
</html>
